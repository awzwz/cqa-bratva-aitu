[project]
name = "cqa"
version = "1.0.0"
description = "CQA — Conversation Quality Analytics for Freedom Broker support dialogs"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "jsonschema>=4.23",
  "openai>=1.50",
  "anthropic>=0.40",
  "prometheus-client>=0.21",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
