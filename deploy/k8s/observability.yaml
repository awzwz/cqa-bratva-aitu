# Prometheus + Grafana inside the cluster, published on the same load balancer at /prometheus and /grafana.
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: prometheus-sd }
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: prometheus-sd }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-sd }
subjects: [{ kind: ServiceAccount, name: prometheus }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d",
                 "--web.external-url=/prometheus/", "--web.route-prefix=/prometheus"]
          ports: [{ containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /prometheus/-/ready, port: 9090 }, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes: [{ name: config, configMap: { name: prometheus-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - { name: GF_SERVER_ROOT_URL, value: "%(protocol)s://%(domain)s/grafana/" }
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/cqa.json }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin, key: password } }
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: providers, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: providers, configMap: { name: grafana-providers } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: cqa-observability }
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /grafana, pathType: Prefix, backend: { service: { name: grafana, port: { number: 3000 } } } }
          - { path: /prometheus, pathType: Prefix, backend: { service: { name: prometheus, port: { number: 9090 } } } }
