# Example only. Real values go to secret.yaml (gitignored) or a sealed/external secret.
apiVersion: v1
kind: Secret
metadata:
  name: cqa-secrets
  namespace: cqa
type: Opaque
stringData:
  CQA_ORG_API_URL: "<signed Power Automate URL from the organisers>"
  CQA_OPENAI_API_KEY: "<key>"
  CQA_ANTHROPIC_API_KEY: ""
  CQA_GEMINI_API_KEY: ""
  POSTGRES_PASSWORD: "<random>"
  CQA_DATABASE_URL: "postgresql+psycopg://cqa:<random>@postgres:5432/cqa"
