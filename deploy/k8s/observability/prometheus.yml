global:
  scrape_interval: 10s
scrape_configs:
  # every pod in namespace cqa annotated prometheus.io/scrape=true (api :8000, worker :9100)
  - job_name: cqa-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [cqa] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  # load balancer / ingress level traffic
  - job_name: ingress-nginx
    static_configs:
      - targets: ["ingress-nginx-controller-metrics.ingress-nginx.svc:10254"]
