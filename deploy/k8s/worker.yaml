# Evaluation workers: consume the Redis Stream "cqa:jobs". Work is I/O-bound (LLM calls), so the
# right scaling signal is queue length: with KEDA installed, apply the ScaledObject below instead of the HPA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: cqa
          env: [{ name: CQA_SERVICE, value: worker }]
          envFrom: [{ configMapRef: { name: cqa-config } }, { secretRef: { name: cqa-secrets } }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
