# Stateless API + UI. Scaled horizontally behind the ingress (DigitalOcean Load Balancer).
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app: api }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 80, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: api
          image: cqa
          env: [{ name: CQA_SERVICE, value: api }]
          envFrom: [{ configMapRef: { name: cqa-config } }, { secretRef: { name: cqa-secrets } }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /api/health, port: 8000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health, port: 8000 }, periodSeconds: 15, failureThreshold: 4 }
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 768Mi } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
