# Local/demo stack: PostgreSQL + Redis + API + worker (+ optional observability profile).
#   docker compose up -d                       # api on :8000, UI at http://localhost:8000
#   docker compose --profile obs up -d         # + Prometheus :9090, Grafana :3000 (admin/admin)
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: cqa, POSTGRES_PASSWORD: cqa, POSTGRES_DB: cqa }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cqa"], interval: 5s, timeout: 3s, retries: 20 }
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  api:
    build: .
    image: cqa:latest
    env_file: .env
    environment:
      CQA_SERVICE: api
      CQA_DATABASE_URL: postgresql+psycopg://cqa:cqa@postgres:5432/cqa
      CQA_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./results:/app/results"]

  worker:
    image: cqa:latest
    env_file: .env
    environment:
      CQA_SERVICE: worker
      CQA_DATABASE_URL: postgresql+psycopg://cqa:cqa@postgres:5432/cqa
      CQA_REDIS_URL: redis://redis:6379/0
    depends_on: [api]
    deploy: { replicas: 2 }
    volumes: ["./data:/app/data", "./results:/app/results"]

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [obs]
    volumes: ["./deploy/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [obs]
    environment: { GF_SECURITY_ADMIN_PASSWORD: admin, GF_AUTH_ANONYMOUS_ENABLED: "true" }
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata: {}
  redisdata: {}
